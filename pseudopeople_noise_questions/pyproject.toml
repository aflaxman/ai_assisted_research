[project]
name = "pseudopeople-noise-questions"
version = "0.1.0"
description = "Notebook answering Dan Weinberg's questions about pseudopeople noise and duplication, by reading the code and running the sample census"
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.1",
    "numpy>=2.4.6",
    "pandas<3",
    "pseudopeople>=1.2.8",
    "scipy>=1.17.1",
]
