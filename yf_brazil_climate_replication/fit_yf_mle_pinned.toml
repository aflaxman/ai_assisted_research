# Deterministic MLE fit of the YF model to the digitized 2017/18 Brazil case
# series. This is the camdl analogue of the paper's own procedure: the paper
# used least-squares optimization (L-BFGS-B, 10,000 box-constrained starts)
# on the ODE skeleton to estimate the two transmission rates and the initial
# exposed/infectious mosquito counts. Here the loss is a Poisson
# log-likelihood on weekly counts rather than sum-of-squares, and the
# optimizer is NLopt's Subplex over Latin-hypercube starts.
#
# BASELINE A: the three climate-sensitive mosquito parameters take their
# Table 1 values, which is what the paper's own baseline run uses.
#
# beta1 is NOT identifiable from human case data: the dynamics depend only on
# beta1*beta2, beta1*y0 and beta1*z0, so rescaling beta1 by any c with the
# other three divided by c leaves the likelihood exactly unchanged. It is
# therefore pinned at the paper's published value and the identifiable
# remainder is estimated. See README.

output_dir = "results"

[model]
camdl = "yf_brazil.camdl"

[data.observations]
cases = "data/yf_brazil_201718_cases.tsv"

# Scale parameters spanning many orders of magnitude: log-uniform priors so
# the Latin-hypercube starts are spread over decades, not over the top decade.
[estimate]
beta2 = { bounds = [1.0e-12, 100.0], prior = { log_uniform = { lower = 1.0e-12, upper = 100.0 } } }
y0    = { bounds = [1.0e-6, 1.0e5],  prior = { log_uniform = { lower = 1.0e-6, upper = 1.0e5 } } }
z0    = { bounds = [1.0e-6, 1.0e5],  prior = { log_uniform = { lower = 1.0e-6, upper = 1.0e5 } } }

[fixed]
beta1   = 218.685636
phi     = 0.45
lambda1 = 1.31
lambda2 = 0.54
gamma   = 0.82
mu      = 0.36
delta   = 0.58
immune  = 0.80
n_ref   = 209469000.0
m_ref   = 418938000.0
# Table 1 gives omega = 2.38/week, which implies a case-fatality ratio of
# omega/(gamma+omega) = 74%. The paper's own Table 4 reports 426 deaths from
# 1254 cases = 34%. 0.42237 is the rate reproducing the paper's reported CFR;
# the Table 1 value is explored separately in the README.
omega   = 0.42237

[method]
algorithm = "nl-sbplx"
backend   = "ode"
chains    = 64
max_evals = 8000

[config]
dt = 0.0625
