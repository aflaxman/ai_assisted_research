[project]
name = "swirm-ews"
version = "0.1.0"
description = "Replication of Olajide, Lutscher & Smith (2026): early-warning signals for infectious diseases with a social-media compartment (PLOS ONE 10.1371/journal.pone.0354091)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "tqdm>=4.65",
]

[project.optional-dependencies]
notebook = ["jupyter>=1.0", "ipykernel>=6.0", "seaborn>=0.13"]
dev = ["pytest>=7.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["swirm"]
