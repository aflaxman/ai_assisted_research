[project]
name = "copula-latent-variable-notes"
version = "0.1.0"
description = "Simulate and fit copula-based latent variable models (IRT + response times, SEM + binary risk outcome) in NumPyro"
requires-python = ">=3.11"
dependencies = [
    "numpyro>=0.17",
    "jax>=0.4.35",
    "numpy>=1.26",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "arviz>=0.20",
    "pandas>=2.1",
    "scikit-learn>=1.4",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
