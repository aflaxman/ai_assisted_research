# france / sirx — generated by gen_fits.py, do not edit by hand
output_dir = "../results"

[model]
camdl = "../sirx_covid.camdl"

[data.observations]
# training window only: the paper's first-wave cutoff is day 200
cases = "../data/france_cases_train.tsv"
osi = "../data/france_osi_train.tsv"

[estimate]
beta    = { bounds = [0.1, 0.9],    start = 0.4,   transform = "identity", prior = { uniform = {} } }
b       = { bounds = [0.0, 1.0],    start = 0.5,   transform = "identity", prior = { uniform = {} } }
gamma   = { bounds = [0.1, 0.5],    start = 0.2,   transform = "identity", prior = { uniform = {} } }
phi     = { bounds = [-135.0, -45.0], start = -90.0, transform = "identity", prior = { uniform = {} } }
eta0    = { bounds = [1.0, 10.0],   start = 5.0,   transform = "identity", prior = { uniform = {} } }
i0      = { bounds = [1.528793e-08, 3.057586e-05], start = 6.836970e-07, transform = "log", prior = { uniform = {} }, ivp = true }
sigma_i = { bounds = [0.5, 100000.0], start = 1308.2, transform = "log", prior = { uniform = {} } }
eps     = { bounds = [0.1, 0.8],    start = 0.4,   transform = "identity", prior = { uniform = {} } }
kappa   = { bounds = [100.0, 5000.0], start = 1000.0, transform = "log", prior = { uniform = {} } }
lam     = { bounds = [0.0, 0.2],    start = 0.01,  transform = "identity", prior = { uniform = {} } }
c       = { bounds = [0.0, 0.01],   start = 0.001, transform = "identity", prior = { uniform = {} } }
x0      = { bounds = [1e-4, 0.1], start = 0.0500, transform = "log", prior = { uniform = {} }, ivp = true }


[fixed]
pop = 65411076
sigma_x = 300.0

[stages.scout]
algorithm = "nl-sbplx"
backend   = "ode"
chains    = 24
init      = "lhs"
max_evals = 3000

[stages.posterior]
algorithm  = "mh"
backend    = "ode"
chains     = 4
iterations = 80000
burn_in    = 30000
init_mle   = "scout"

[config]
dt = 0.25
